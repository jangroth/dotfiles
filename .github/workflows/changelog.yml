name: Update Changelog

on:
  push:
    branches:
      - main

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find PR for pushed commit
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Direct pushes to main have no merged PR and are skipped
          pr_json=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0] // empty')
          if [ -z "$pr_json" ]; then
            echo "No merged PR associated with ${{ github.sha }}; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          number=$(echo "$pr_json" | jq -r '.number')
          title=$(echo "$pr_json" | jq -r '.title')
          merged_at=$(echo "$pr_json" | jq -r '.merged_at' | cut -c1-10)
          if grep -qF "([#${number}](../../pull/${number}))" CHANGELOG.md; then
            echo "PR #${number} is already in CHANGELOG.md; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "merged_at=$merged_at" >> "$GITHUB_OUTPUT"

      - name: Prepend changelog entry
        if: steps.pr.outputs.skip != 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          MERGED_AT: ${{ steps.pr.outputs.merged_at }}
          REPO: ${{ github.repository }}
        run: |
          # Insert after the [Unreleased] section header and its blank line
          python3 - <<'EOF'
          import os, re
          entry = f"## [{os.environ['MERGED_AT']}]\n\n### Changed\n\n- {os.environ['PR_TITLE']} ([#{os.environ['PR_NUMBER']}](../../pull/{os.environ['PR_NUMBER']}))\n"
          with open('CHANGELOG.md', 'r') as f:
              content = f.read()
          # Insert the new entry after the [Unreleased] block
          pattern = r'(## \[Unreleased\]\n\n)'
          replacement = r'\g<1>' + entry + '\n'
          new_content = re.sub(pattern, replacement, content, count=1)
          with open('CHANGELOG.md', 'w') as f:
              f.write(new_content)
          EOF

      - name: Commit updated changelog
        if: steps.pr.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore: update changelog for PR #${{ steps.pr.outputs.number }}"
          git push
